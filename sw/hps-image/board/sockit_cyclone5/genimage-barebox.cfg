#
# Full-stack SoCKit boot image with barebox.
#
# Partition layout (mirrors the de10nano Buildroot reference):
#   p1 (0xa2) -> barebox xload / SPL
#   p2 (FAT)  -> boot partition: kernel, DTB, main barebox, barebox env, FPGA image
#   p3 (ext2) -> Linux rootfs
#
# The xload initialises SDRAM and loads barebox.bin from the FAT partition.
# barebox runs the custom environment from barebox.env, which loads the FPGA
# image and hands off to Linux.
#

image boot.vfat {
	vfat {
		file zImage {
			image = "zImage"
		}

		file socfpga_cyclone5_sockit.dtb {
			image = "socfpga_cyclone5_sockit.dtb"
		}

		file barebox.bin {
			image = "barebox-socfpga-sockit.img"
		}

		file barebox.env {
			image = "barebox-env"
		}

		file sockit.rbf {
			image = "sockit.rbf"
		}
	}

	size = 16M
}

image sdcard-barebox.img {
	hdimage {
	}

	partition spl {
		partition-type = 0xa2
		image = "barebox-socfpga-sockit-xload.img"
		size = 1M
	}

	partition boot {
		partition-type = 0xc
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
