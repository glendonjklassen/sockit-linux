#
# Hybrid full-stack SoCKit boot payload.
#
# The current primary path preserves the Terasic raw boot partition and U-Boot
# chain from the reference image, while Buildroot owns the FAT boot payload and
# Linux root filesystem.
#

image boot.vfat {
	vfat {
		file zImage {
			image = "zImage"
		}

		file socfpga_cyclone5_sockit.dtb {
			image = "socfpga_cyclone5_sockit.dtb"
		}

		file socfpga.dtb {
			image = "socfpga_cyclone5_sockit.dtb"
		}

		file u-boot.scr {
			image = "u-boot.scr"
		}

		file sockit.rbf {
			image = "sockit.rbf"
		}

		file soc_system_vendor.rbf {
			image = "soc_system_vendor.rbf"
		}
	}

	size = 838860K
}
