#
# Full-stack SoCKit image layout.
#
# This is the new primary image path for the repo: Buildroot owns the raw
# early-boot partition, the FAT boot partition, and the Linux root filesystem.
#

image boot.vfat {
	vfat {
		file zImage {
			image = "zImage"
		}

		file socfpga_cyclone5_sockit.dtb {
			image = "socfpga_cyclone5_sockit.dtb"
		}

		file barebox.bin {
			image = "barebox-socfpga-sockit.img"
		}

		file barebox.env {
			image = "barebox-env"
		}

		file sockit_ids.rbf {
			image = "sockit_ids.rbf"
		}

		file soc_system_vendor.rbf {
			image = "soc_system_vendor.rbf"
		}
	}

	size = 32M
}

image sdcard-full-stack.img {
	hdimage {
	}

	partition spl {
		partition-type = 0xa2
		image = "barebox-socfpga-sockit-xload.img"
		size = 1M
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}
}
