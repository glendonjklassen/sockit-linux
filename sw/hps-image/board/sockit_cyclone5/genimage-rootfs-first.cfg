#
# Rootfs-first image layout for the SoCKit bring-up path.
#
# This file is intentionally conservative. It models the known-good SD card
# layout we observed:
#   - a small raw 0xa2 partition at the front of the card
#   - a FAT boot partition
#   - a Linux root filesystem partition
#
# The actual payload for the raw partition is not defined here yet because the
# current plan is to preserve the known-good early boot stages initially.
#

image boot.vfat {
	vfat {
		file zImage {
			image = "zImage"
		}

		file socfpga.dtb {
			image = "socfpga.dtb"
		}
	}

	size = 8M
}

image sdcard-rootfs-first.img {
	hdimage {
	}

	partition spl {
		partition-type = 0xa2
		size = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext2"
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
	}
}
